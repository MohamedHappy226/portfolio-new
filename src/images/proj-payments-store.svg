<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Online payment checkout illustration">
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1016"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="0.3" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" fill="url(#pBg)"/>
  <rect width="800" height="520" fill="url(#pGlow)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 130H800M0 260H800M0 390H800M200 0V520M400 0V520M600 0V520"/>
  </g>

  <!-- back card -->
  <g transform="translate(120 118) rotate(-8)">
    <rect width="330" height="200" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>

  <!-- front card -->
  <g transform="translate(150 150)">
    <rect width="340" height="208" rx="24" fill="url(#pCard)" fill-opacity="0.20" stroke="url(#pCard)" stroke-width="2.5"/>
    <rect x="28" y="42" width="52" height="38" rx="8" fill="#facc15" fill-opacity="0.85"/>
    <path d="M28 61h52M54 42v38" stroke="#0a0a0f" stroke-opacity="0.35" stroke-width="2"/>
    <g fill="#e2e8f0" fill-opacity="0.75">
      <rect x="28" y="112" width="60" height="12" rx="6"/>
      <rect x="100" y="112" width="60" height="12" rx="6"/>
      <rect x="172" y="112" width="60" height="12" rx="6"/>
      <rect x="244" y="112" width="60" height="12" rx="6"/>
    </g>
    <rect x="28" y="152" width="112" height="10" rx="5" fill="#e2e8f0" fill-opacity="0.4"/>
    <circle cx="272" cy="60" r="26" fill="#f472b6" fill-opacity="0.55"/>
    <circle cx="300" cy="60" r="26" fill="#22d3ee" fill-opacity="0.55"/>
  </g>

  <!-- secure checkout panel -->
  <g transform="translate(530 116)">
    <rect width="200" height="288" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <g fill="#e2e8f0" fill-opacity="0.3">
      <rect x="24" y="30" width="120" height="10" rx="5"/>
      <rect x="24" y="58" width="152" height="10" rx="5"/>
      <rect x="24" y="86" width="96" height="10" rx="5"/>
    </g>
    <path d="M24 118h152" stroke="#ffffff" stroke-opacity="0.12"/>
    <g fill="#e2e8f0" fill-opacity="0.45">
      <rect x="24" y="136" width="70" height="10" rx="5"/>
    </g>
    <rect x="120" y="132" width="56" height="16" rx="8" fill="#34d399" fill-opacity="0.85"/>
    <rect x="24" y="180" width="152" height="44" rx="14" fill="#22d3ee" fill-opacity="0.85"/>
    <path d="M78 202l14 14 26-28" fill="none" stroke="#0a0a0f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#e2e8f0" fill-opacity="0.25">
      <rect x="52" y="244" width="96" height="8" rx="4"/>
    </g>
  </g>

  <!-- lock -->
  <g transform="translate(390 402)">
    <circle cx="0" cy="0" r="40" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="2"/>
    <rect x="-16" y="-4" width="32" height="26" rx="6" fill="none" stroke="#34d399" stroke-width="3.5"/>
    <path d="M-9-4v-9a9 9 0 0 1 18 0v9" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
