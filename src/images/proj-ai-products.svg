<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="AI supermarket product detection and classification illustration">
  <defs>
    <linearGradient id="aBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1016"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="520" fill="url(#aBg)"/>
  <rect width="800" height="520" fill="url(#aGlow)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 104H800M0 208H800M0 312H800M0 416H800M160 0V520M320 0V520M480 0V520M640 0V520"/>
  </g>

  <!-- shelf with detected products -->
  <g transform="translate(64 92)">
    <!-- shelf boards -->
    <g fill="#ffffff" fill-opacity="0.10">
      <rect x="0" y="152" width="440" height="10" rx="5"/>
      <rect x="0" y="316" width="440" height="10" rx="5"/>
    </g>

    <!-- row 1 products -->
    <g>
      <rect x="22" y="58" width="66" height="94" rx="9" fill="#22d3ee" fill-opacity="0.24"/>
      <rect x="112" y="42" width="58" height="110" rx="28" fill="#f472b6" fill-opacity="0.24"/>
      <rect x="196" y="72" width="78" height="80" rx="9" fill="#facc15" fill-opacity="0.24"/>
      <rect x="300" y="50" width="62" height="102" rx="9" fill="#a78bfa" fill-opacity="0.24"/>
    </g>
    <!-- row 1 detection boxes -->
    <g fill="none" stroke-width="2.5">
      <rect x="16" y="52" width="78" height="106" rx="8" stroke="#34d399"/>
      <rect x="106" y="36" width="70" height="122" rx="8" stroke="#34d399"/>
      <rect x="190" y="66" width="90" height="92" rx="8" stroke="#34d399"/>
      <rect x="294" y="44" width="74" height="114" rx="8" stroke="#34d399"/>
    </g>
    <g fill="#34d399">
      <rect x="16" y="34" width="54" height="16" rx="4"/>
      <rect x="106" y="18" width="54" height="16" rx="4"/>
      <rect x="190" y="48" width="54" height="16" rx="4"/>
      <rect x="294" y="26" width="54" height="16" rx="4"/>
    </g>

    <!-- row 2 products -->
    <g>
      <rect x="30" y="226" width="72" height="90" rx="9" fill="#34d399" fill-opacity="0.24"/>
      <rect x="126" y="242" width="64" height="74" rx="9" fill="#22d3ee" fill-opacity="0.24"/>
      <rect x="216" y="214" width="58" height="102" rx="28" fill="#fb923c" fill-opacity="0.24"/>
      <rect x="300" y="238" width="76" height="78" rx="9" fill="#f472b6" fill-opacity="0.24"/>
    </g>
    <g fill="none" stroke-width="2.5">
      <rect x="24" y="220" width="84" height="102" rx="8" stroke="#22d3ee"/>
      <rect x="120" y="236" width="76" height="86" rx="8" stroke="#22d3ee"/>
      <rect x="210" y="208" width="70" height="114" rx="8" stroke="#22d3ee"/>
      <rect x="294" y="232" width="88" height="90" rx="8" stroke="#22d3ee"/>
    </g>
    <g fill="#22d3ee">
      <rect x="24" y="202" width="54" height="16" rx="4"/>
      <rect x="120" y="218" width="54" height="16" rx="4"/>
      <rect x="210" y="190" width="54" height="16" rx="4"/>
      <rect x="294" y="214" width="54" height="16" rx="4"/>
    </g>
  </g>

  <!-- prediction panel -->
  <g transform="translate(540 118)">
    <rect width="204" height="290" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>

    <g transform="translate(24 28)">
      <circle cx="14" cy="14" r="14" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="2"/>
      <path d="M8 14l4 4 9-9" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="40" y="8" width="92" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.4"/>
    </g>

    <!-- confidence bars -->
    <g transform="translate(24 82)">
      <g fill="#e2e8f0" fill-opacity="0.28">
        <rect x="0" y="0" width="60" height="8" rx="4"/>
        <rect x="0" y="46" width="72" height="8" rx="4"/>
        <rect x="0" y="92" width="52" height="8" rx="4"/>
        <rect x="0" y="138" width="66" height="8" rx="4"/>
      </g>
      <g fill="#ffffff" fill-opacity="0.08">
        <rect x="0" y="16" width="156" height="12" rx="6"/>
        <rect x="0" y="62" width="156" height="12" rx="6"/>
        <rect x="0" y="108" width="156" height="12" rx="6"/>
        <rect x="0" y="154" width="156" height="12" rx="6"/>
      </g>
      <rect x="0" y="16" width="146" height="12" rx="6" fill="#34d399"/>
      <rect x="0" y="62" width="102" height="12" rx="6" fill="#22d3ee"/>
      <rect x="0" y="108" width="64" height="12" rx="6" fill="#a78bfa"/>
      <rect x="0" y="154" width="34" height="12" rx="6" fill="#f472b6"/>
    </g>
  </g>

  <!-- scan beam -->
  <g opacity="0.7">
    <rect x="48" y="266" width="472" height="3" rx="1.5" fill="#34d399"/>
    <rect x="48" y="266" width="472" height="14" rx="7" fill="#34d399" fill-opacity="0.16"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#34d399" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M48 112V80h32M488 80h32v32M520 424v32h-32M80 456H48v-32"/>
  </g>
</svg>
